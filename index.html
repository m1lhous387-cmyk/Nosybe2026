<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coloring">
  <title>Coloring Picker</title>
  
  <!-- Apple Touch Icon incorporata in alta risoluzione (Data SVG) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%236366f1'/><stop offset='100%25' stop-color='%23ec4899'/></linearGradient></defs><rect width='180' height='180' rx='40' fill='url(%23g)'/><text x='50%25' y='68%25' font-size='105' text-anchor='middle'>🎨</text></svg>">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #ec4899;
      --accent-light: #fdf2f8;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 70px);
      padding-left: env(safe-area-inset-left, 16px);
      padding-right: env(safe-area-inset-right, 16px);
      max-width: 540px;
      margin: 0 auto;
    }

    /* Header */
    header {
      padding: 1.2rem 0 0.8rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Nav bar bottom */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom, 12px);
      padding-top: 8px;
      z-index: 100;
      max-width: 540px;
      margin: 0 auto;
    }
    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 16px;
      transition: color 0.15s;
    }
    .nav-btn.active {
      color: var(--primary);
    }
    .nav-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 2;
    }

    /* Views */
    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 1.25rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      margin-bottom: 1.2rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.95rem;
      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: #eef2ff;
      color: var(--primary);
    }
    .btn-secondary:active { background: #e0e7ff; }
    .btn-accent {
      background: var(--accent);
      color: white;
    }
    .btn-accent:active { background: #db2777; }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }

    /* Randomizer Draw Section */
    .hero-box {
      text-align: center;
      padding: 1.5rem 1rem;
    }
    .result-container {
      display: none;
      margin-top: 1.2rem;
      text-align: center;
    }
    .cover-view {
      width: 160px;
      height: 220px;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
      margin: 0 auto 1rem auto;
      display: block;
      background: #f1f5f9;
    }
    .result-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 0.3rem;
    }
    .result-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }
    .page-banner {
      background: var(--accent-light);
      border: 1.5px solid #fbcfe8;
      border-radius: 18px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .page-banner-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent);
      text-transform: uppercase;
    }
    .page-banner-num {
      font-size: 3rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1.1;
      margin: 0.2rem 0;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-top: 0.8rem;
    }

    /* Book List */
    .book-item-card {
      display: flex;
      align-items: center;
      background: var(--card);
      border-radius: 16px;
      padding: 0.85rem;
      margin-bottom: 0.75rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      gap: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .book-item-card:active { background: #f1f5f9; }
    .book-thumb {
      width: 52px;
      height: 70px;
      border-radius: 8px;
      object-fit: cover;
      background: #e2e8f0;
      flex-shrink: 0;
    }
    .book-info {
      flex: 1;
      min-width: 0;
    }
    .book-name {
      font-weight: 700;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.2rem;
    }
    .book-meta {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .progress-bar-bg {
      height: 6px;
      width: 100%;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--success);
      border-radius: 10px;
      transition: width 0.3s;
    }

    /* Book Detail / Grid View */
    .detail-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }
    .back-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .detail-summary {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .detail-cover {
      width: 75px;
      height: 100px;
      border-radius: 10px;
      object-fit: cover;
      background: #e2e8f0;
      box-shadow: var(--shadow-sm);
    }
    .pages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 8px;
      margin-top: 1rem;
    }
    .page-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #ffffff;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }
    .page-cell:active { transform: scale(0.92); }
    .page-cell.completed {
      background: #dcfce7;
      border-color: #86efac;
      color: #15803d;
      text-decoration: line-through;
    }

    /* Forms */
    .form-group { margin-bottom: 1rem; }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    input[type="text"], input[type="number"], input[type="file"] {
      width: 100%;
      padding: 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      background: #fff;
    }
    input[type="file"] { padding: 0.6rem; }
  </style>
</head>
<body>

  <!-- Top App Title -->
  <header>
    <h1 id="app-heading">🎨 Color Picker</h1>
  </header>

  <!-- VIEW 1: RANDOMIZER -->
  <section id="view-draw" class="view-section active">
    <div class="card hero-box">
      <h2 style="font-size:1.25rem; font-weight:800; margin-bottom:0.4rem;">Cosa si colora stasera?</h2>
      <p style="color:var(--muted); font-size:0.9rem; margin-bottom:1.2rem;">Pesca un libro e un disegno ancora da completare.</p>
      <button class="btn" onclick="drawSelection()">🎲 Estrai Random</button>

      <div id="draw-result" class="result-container">
        <img id="res-cover" class="cover-view" src="" alt="Copertina">
        <div id="res-title" class="result-title"></div>
        <div id="res-sub" class="result-sub"></div>

        <div class="page-banner">
          <div class="page-banner-label">DISEGNO NUMERO</div>
          <div id="res-page" class="page-banner-num">-</div>
        </div>

        <button class="btn btn-accent" onclick="markExtractedAsCompleted()">✅ Segna come completato</button>

        <div class="actions-grid">
          <button class="btn btn-secondary" onclick="rerollPageOnly()">🔄 Altro disegno</button>
          <button class="btn btn-outline" onclick="drawSelection()">📚 Altro libro</button>
        </div>
      </div>
    </div>
  </section>

  <!-- VIEW 2: LIBRERIA -->
  <section id="view-library" class="view-section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
      <h2 style="font-size:1.2rem; font-weight:700;">I tuoi libri (<span id="book-count">0</span>)</h2>
      <button class="btn btn-secondary" style="width:auto; padding:0.5rem 0.9rem; font-size:0.85rem;" onclick="switchTab('view-add')">➕ Aggiungi</button>
    </div>
    <div id="library-list"></div>
  </section>

  <!-- VIEW 3: AGGIUNGI LIBRO -->
  <section id="view-add" class="view-section">
    <div class="card">
      <h2 style="font-size:1.2rem; font-weight:800; margin-bottom:1rem;">➕ Nuovo Libro</h2>
      <div class="form-group">
        <label for="book-title">Titolo del Libro</label>
        <input type="text" id="book-title" placeholder="Es. Colori d'Autunno, Disney..." required>
      </div>
      <div class="form-group">
        <label for="book-pages">Numero totale di disegni / pagine</label>
        <input type="number" id="book-pages" value="100" min="1">
      </div>
      <div class="form-group">
        <label for="book-cover">Foto di Copertina (dalla galleria o fotocamera)</label>
        <input type="file" id="book-cover" accept="image/*">
      </div>
      <button class="btn" onclick="saveNewBook()">💾 Salva Libro</button>
    </div>
  </section>

  <!-- VIEW 4: DETTAGLIO LIBRO & GRIGLIA DISEGNI -->
  <section id="view-detail" class="view-section">
    <div class="detail-header">
      <button class="back-btn" onclick="switchTab('view-library')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <h2 id="detail-title" style="font-size:1.2rem; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Dettagli</h2>
    </div>

    <div class="card detail-summary">
      <img id="detail-cover" class="detail-cover" src="" alt="Cover">
      <div style="flex:1;">
        <div style="font-size:0.85rem; color:var(--muted); margin-bottom:0.2rem;">Completamento:</div>
        <div id="detail-stats" style="font-size:1.1rem; font-weight:800; margin-bottom:0.4rem;">0 / 100</div>
        <div class="progress-bar-bg">
          <div id="detail-progress-bar" class="progress-bar-fill" style="width:0%;"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
        <h3 style="font-size:1rem; font-weight:700;">Tutti i disegni</h3>
        <span style="font-size:0.75rem; color:var(--muted);">Tocca per spuntare</span>
      </div>
      <div id="pages-grid" class="pages-grid"></div>
      
      <div style="margin-top:1.5rem; border-top:1px solid var(--border); padding-top:1rem;">
        <button class="btn btn-outline" style="color:var(--danger); border-color:#fecaca;" onclick="deleteCurrentBook()">🗑️ Elimina questo libro</button>
      </div>
    </div>
  </section>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-draw" onclick="switchTab('view-draw')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><path d="m10 15 5-3-5-3v6z"></path></svg>
      <span>Estrai</span>
    </button>
    <button class="nav-btn" id="nav-library" onclick="switchTab('view-library')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      <span>Libreria</span>
    </button>
    <button class="nav-btn" id="nav-add" onclick="switchTab('view-add')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
      <span>Aggiungi</span>
    </button>
  </nav>

  <script>
    let library = JSON.parse(localStorage.getItem('coloring_books_v2')) || [];
    let currentActiveBook = null;
    let lastDrawnPage = null;

    function saveState() {
      try {
        localStorage.setItem('coloring_books_v2', JSON.stringify(library));
      } catch (err) {
        alert("Memoria locale quasi piena! Riduci la dimensione delle foto di copertina.");
      }
    }

    function switchTab(viewId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      const target = document.getElementById(viewId);
      if (target) target.classList.add('active');

      if (viewId === 'view-draw') document.getElementById('nav-draw').classList.add('active');
      else if (viewId === 'view-library') {
        document.getElementById('nav-library').classList.add('active');
        renderLibrary();
      } else if (viewId === 'view-add') {
        document.getElementById('nav-add').classList.add('active');
      }
      window.scrollTo(0, 0);
    }

    function renderLibrary() {
      const list = document.getElementById('library-list');
      const count = document.getElementById('book-count');
      list.innerHTML = '';
      count.textContent = library.length;

      if (library.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:var(--muted); padding:2rem 1rem;">Nessun libro inserito.<br>Tocca "Aggiungi" per iniziare!</div>';
        return;
      }

      library.forEach((book, idx) => {
        const completedCount = (book.completed || []).length;
        const total = book.pages || 100;
        const percent = Math.min(100, Math.round((completedCount / total) * 100));

        const card = document.createElement('div');
        card.className = 'book-item-card';
        card.onclick = () => openBookDetail(idx);

        const coverSrc = book.cover || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="52" height="70" viewBox="0 0 52 70"><rect width="52" height="70" fill="%23e2e8f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%2394a3b8" font-size="9">No foto</text></svg>';

        card.innerHTML = `
          <img class="book-thumb" src="${coverSrc}">
          <div class="book-info">
            <div class="book-name">${book.title}</div>
            <div class="book-meta">
              <span>${completedCount} di ${total} completati (${percent}%)</span>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width:${percent}%;"></div>
              </div>
            </div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        `;
        list.appendChild(card);
      });
    }

    function openBookDetail(idx) {
      currentActiveBook = library[idx];
      if (!currentActiveBook.completed) currentActiveBook.completed = [];

      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('view-detail').classList.add('active');

      document.getElementById('detail-title').textContent = currentActiveBook.title;
      document.getElementById('detail-cover').src = currentActiveBook.cover || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="75" height="100" viewBox="0 0 75 100"><rect width="75" height="100" fill="%23e2e8f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%2394a3b8" font-size="12">No foto</text></svg>';

      renderDetailGrid();
    }

    function renderDetailGrid() {
      const total = currentActiveBook.pages || 100;
      const completed = currentActiveBook.completed || [];
      const stats = document.getElementById('detail-stats');
      const bar = document.getElementById('detail-progress-bar');
      const grid = document.getElementById('pages-grid');

      stats.textContent = `${completed.length} / ${total} completati`;
      const pct = Math.min(100, Math.round((completed.length / total) * 100));
      bar.style.width = pct + '%';

      grid.innerHTML = '';
      for (let p = 1; p <= total; p++) {
        const cell = document.createElement('div');
        const isDone = completed.includes(p);
        cell.className = 'page-cell' + (isDone ? ' completed' : '');
        cell.textContent = p;
        cell.onclick = () => togglePageCompleted(p);
        grid.appendChild(cell);
      }
    }

    function togglePageCompleted(pageNum) {
      if (!currentActiveBook.completed) currentActiveBook.completed = [];
      const pos = currentActiveBook.completed.indexOf(pageNum);
      if (pos > -1) {
        currentActiveBook.completed.splice(pos, 1);
      } else {
        currentActiveBook.completed.push(pageNum);
      }
      saveState();
      renderDetailGrid();
    }

    function deleteCurrentBook() {
      if (confirm(`Sei sicuro di voler eliminare "${currentActiveBook.title}"?`)) {
        const idx = library.indexOf(currentActiveBook);
        if (idx > -1) {
          library.splice(idx, 1);
          saveState();
        }
        switchTab('view-library');
      }
    }

    function compressImage(file, cb) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 450;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          cb(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveNewBook() {
      const title = document.getElementById('book-title').value.trim();
      const pages = parseInt(document.getElementById('book-pages').value, 10) || 100;
      const fileInput = document.getElementById('book-cover');

      if (!title) {
        alert("Inserisci un titolo per il libro!");
        return;
      }

      const finish = (coverData) => {
        library.push({
          title: title,
          pages: pages,
          cover: coverData || '',
          completed: []
        });
        saveState();
        document.getElementById('book-title').value = '';
        document.getElementById('book-pages').value = '100';
        fileInput.value = '';
        switchTab('view-library');
      };

      if (fileInput.files && fileInput.files[0]) {
        compressImage(fileInput.files[0], finish);
      } else {
        finish('');
      }
    }

    /* Randomizer */
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function drawSelection() {
      if (library.length === 0) {
        alert("Aggiungi prima almeno un libro dalla sezione Libreria!");
        switchTab('view-add');
        return;
      }

      // Trova libri con almeno 1 disegno ancora incompleto
      const availableBooks = library.filter(b => {
        const completed = b.completed || [];
        return completed.length < (b.pages || 100);
      });

      if (availableBooks.length === 0) {
        alert("Congratulazioni! Ha completato tutti i disegni di tutti i libri in libreria!");
        return;
      }

      currentActiveBook = availableBooks[getRandomInt(0, availableBooks.length - 1)];
      pickRandomRemainingPage();
      displayDrawResult();
    }

    function pickRandomRemainingPage() {
      const total = currentActiveBook.pages || 100;
      const completed = new Set(currentActiveBook.completed || []);
      const remaining = [];
      for (let i = 1; i <= total; i++) {
        if (!completed.has(i)) remaining.push(i);
      }
      if (remaining.length === 0) return null;
      lastDrawnPage = remaining[getRandomInt(0, remaining.length - 1)];
      return lastDrawnPage;
    }

    function rerollPageOnly() {
      if (!currentActiveBook) return;
      pickRandomRemainingPage();
      displayDrawResult();
    }

    function markExtractedAsCompleted() {
      if (!currentActiveBook || !lastDrawnPage) return;
      if (!currentActiveBook.completed) currentActiveBook.completed = [];
      if (!currentActiveBook.completed.includes(lastDrawnPage)) {
        currentActiveBook.completed.push(lastDrawnPage);
        saveState();
      }
      alert(`Disegno #${lastDrawnPage} segnato come completato! 🎨`);
      
      const next = pickRandomRemainingPage();
      if (!next) {
        alert(`Complimenti! Hai completato tutti i disegni del libro "${currentActiveBook.title}"! 🎉`);
        document.getElementById('draw-result').style.display = 'none';
      } else {
        displayDrawResult();
      }
    }

    function displayDrawResult() {
      const box = document.getElementById('draw-result');
      const img = document.getElementById('res-cover');
      const title = document.getElementById('res-title');
      const sub = document.getElementById('res-sub');
      const pageNum = document.getElementById('res-page');

      title.textContent = currentActiveBook.title;
      const done = (currentActiveBook.completed || []).length;
      const total = currentActiveBook.pages || 100;
      sub.textContent = `${done} su ${total} disegni già completati`;

      img.src = currentActiveBook.cover || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="220" viewBox="0 0 160 220"><rect width="160" height="220" fill="%23e2e8f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%2394a3b8" font-size="14">No Copertina</text></svg>';
      pageNum.textContent = lastDrawnPage;

      box.style.display = 'block';
    }

    // Startup
    renderLibrary();
  </script>
</body>
</html>
